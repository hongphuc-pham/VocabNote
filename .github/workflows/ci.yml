name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run — CI feedback should be
# about the current commit, not a queue of stale ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

defaults:
  run:
    working-directory: app

jobs:
  # ---------------------------------------------------------------------------
  # Format, lint, generated-code drift and the test suite. This is the gate that
  # matters; the build jobs below only prove the result compiles for a store.
  # ---------------------------------------------------------------------------
  verify:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # RULES.md §26 — the formatter is enforced, not advisory.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # RULES.md §27 — generated code is committed, so a stale checkout is a bug.
      # Regenerate and fail if anything moved.
      - name: Check generated code is up to date
        run: |
          dart run build_runner build
          flutter gen-l10n
          if ! git diff --exit-code --stat; then
            echo "::error::Generated code is out of date. Run 'dart run build_runner build' and 'flutter gen-l10n', then commit the result."
            exit 1
          fi

      # DATA-SOURCES.md section 6 / RULES.md section 15: permissive licences
      # only. Failing here beats discovering it during release prep.
      - name: Check dependency licences
        run: dart run tool/check_licences.dart

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Android — release App Bundle, unsigned. Signing keys live only in GitHub
  # secrets and are wired up at M8; CI must never need them to prove a build.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build App Bundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: vocabnote-android-aab
          path: app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS — unsigned build. This is the only place the iOS half of the M0 exit
  # criteria can be proven, since the project is developed on Windows.
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package .app
        run: |
          cd build/ios/iphoneos
          zip -ryq VocabNote-unsigned.zip Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: vocabnote-ios-unsigned
          path: app/build/ios/iphoneos/VocabNote-unsigned.zip
          if-no-files-found: error
