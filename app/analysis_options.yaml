# very_good_analysis is the lint baseline (ARCHITECTURE.md §3, RULES.md §26).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Generated code is committed (RULES.md §27) but is not ours to lint.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/l10n/gen/**"
    - "test/migration/generated/**"
    - build/**
    - android/**
    - ios/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # RULES.md §22 forbids hard-coded user-facing strings in widgets. The
    # analyzer cannot tell a label from a map key, so this stays a warning that
    # CI escalates via --fatal-warnings rather than a blanket error.
    missing_required_param: error
    missing_return: error
    # Layer-direction violations are caught by test/architecture, not by a lint.
    todo: ignore

linter:
  rules:
    # The layered design deliberately exposes small public classes with no
    # constructor arguments; requiring a const constructor everywhere is noise.
    public_member_api_docs: true
    lines_longer_than_80_chars: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
    # Domain entities are compared by value; identity comparison is a bug.
    avoid_equals_and_hash_code_on_mutable_classes: true
